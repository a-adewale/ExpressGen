[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expressgen"
version = "0.1.0"
description = "Deterministic JSON-to-Express/Prisma scaffolding with Jinja2."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "ExpressGen contributors" }
]
dependencies = [
  "Jinja2>=3.1,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[project.scripts]
expressgen = "expressgen.cli:main"

[tool.setuptools.packages.find]
include = ["expressgen*"]

[tool.setuptools.package-data]
expressgen = ["templates/*.j2"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
